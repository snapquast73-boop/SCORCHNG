name: Verify and publish Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: node tools/build.mjs
      - name: Collect official source text without inventing unavailable data
        run: python3 pipeline/official.py
      - name: Verify official live APIs
        run: node tools/live-check.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and project-path verification
        env:
          LIVE_BROWSER: 1
        run: npm run test:browser
      - name: Record source verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: |
            _site/data/official.json
            test-results/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Publishing an artifact and changing repository Pages settings are separate operations.
      # Do not mutate repository settings with the deployment token.
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published HTML, assets, navigation and official source rows
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/deployed-check.mjs
